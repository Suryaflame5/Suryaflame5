<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%" style="background:#07090e; display:block; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Cinematic subtle lighting -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear horizon accent -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Signal trace gradient -->
    <linearGradient id="signalTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Technical pattern for architectural floor -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#334155" fill-opacity="0.5"/>
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      
      /* Subtle, purposeful data pulse along the bus line */
      @keyframes busPulse {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-bus {
        stroke-dasharray: 20 60;
        animation: busPulse 6s linear infinite;
      }

      /* Slow, calm breathing on status indicator */
      @keyframes gentleGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      .status-pulse {
        animation: gentleGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base canvas & grid -->
  <rect width="960" height="280" rx="12" fill="#07090e" stroke="#1a202c" stroke-width="1"/>
  <rect width="960" height="280" rx="12" fill="url(#centerGlow)"/>
  <rect x="1" y="1" width="958" height="278" rx="11" fill="url(#techGrid)"/>

  <!-- Technical Hairlines & Horizon Line -->
  <line x1="40" y1="180" x2="920" y2="180" stroke="#1e293b" stroke-width="1"/>
  <line x1="280" y1="180" x2="680" y2="180" stroke="url(#horizonGlow)" stroke-width="1.5"/>

  <!-- Subtle Data Bus Trace (Functional System Path) -->
  <path d="M 60 230 L 260 230 L 300 210 L 660 210 L 700 230 L 900 230" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M 60 230 L 260 230 L 300 210 L 660 210 L 700 230 L 900 230" fill="none" stroke="url(#signalTrace)" stroke-width="1.5" class="pulse-bus"/>

  <!-- Header Coordinate Metadata (Senior Instrument Aesthetic) -->
  <g class="mono" font-size="10" fill="#64748b" letter-spacing="1.5">
    <text x="40" y="36">SYSTEM: READY</text>
    <text x="40" y="52" fill="#475569">KERNEL / PIPELINE ARCHITECTURE</text>
    <text x="920" y="36" text-anchor="end">CHENNAI, IN [13.0827° N, 80.2707° E]</text>
    <text x="920" y="52" text-anchor="end" fill="#475569">BUILD: 2026.4 / NATIVE</text>
  </g>

  <!-- Corner Crosshair Ticks -->
  <g stroke="#334155" stroke-width="1">
    <line x1="32" y1="40" x2="40" y2="40"/>
    <line x1="40" y1="32" x2="40" y2="40"/>
    <line x1="920" y1="40" x2="928" y2="40"/>
    <line x1="920" y1="32" x2="920" y2="40"/>
    <line x1="32" y1="240" x2="40" y2="240"/>
    <line x1="40" y1="240" x2="40" y2="248"/>
    <line x1="920" y1="240" x2="928" y2="240"/>
    <line x1="920" y1="240" x2="920" y2="248"/>
  </g>

  <!-- Primary Identity: Cinematic & Editorial -->
  <g text-anchor="middle">
    <!-- Subtle top eyebrow -->
    <text x="480" y="94" class="mono" font-size="11" fill="#94a3b8" letter-spacing="4" font-weight="500">
      SYSTEMS &amp; REAL-TIME SOFTWARE
    </text>

    <!-- Main Title -->
    <text x="480" y="142" font-size="36" font-weight="600" fill="#f8fafc" letter-spacing="6">
      SURYANARAYANAN
    </text>

    <!-- Subtitle: Concrete Domains -->
    <text x="480" y="168" font-size="13" fill="#94a3b8" letter-spacing="1.5">
      Native Audio Synchronization · Low-Latency Streaming · Computer Vision Pipelines
    </text>
  </g>

  <!-- Functional System Pipeline Nodes along the bottom trace -->
  <g class="mono" font-size="10">
    <!-- Node 1: Ingest -->
    <circle cx="160" cy="230" r="3" fill="#38bdf8"/>
    <text x="160" y="250" text-anchor="middle" fill="#94a3b8">STREAM INGEST</text>
    <text x="160" y="262" text-anchor="middle" fill="#475569">PCM / Frame Source</text>

    <!-- Node 2: Lock-Free Buffer -->
    <circle cx="380" cy="210" r="3" fill="#818cf8"/>
    <text x="380" y="196" text-anchor="middle" fill="#94a3b8">LOCK-FREE RING BUFFER</text>
    <text x="380" y="184" text-anchor="middle" fill="#475569">Zero-Copy NDK</text>

    <!-- Node 3: Sync / Reasoning -->
    <circle cx="580" cy="210" r="3" fill="#818cf8"/>
    <text x="580" y="196" text-anchor="middle" fill="#94a3b8">CLOCK SKEW COMPENSATOR</text>
    <text x="580" y="184" text-anchor="middle" fill="#475569">Sub-millisecond Drift</text>

    <!-- Node 4: Hardware Dispatch -->
    <circle cx="800" cy="230" r="3" fill="#34d399" class="status-pulse"/>
    <text x="800" y="250" text-anchor="middle" fill="#94a3b8">DISPATCH / SINK</text>
    <text x="800" y="262" text-anchor="middle" fill="#475569">Multicast &amp; Neural Inference</text>
  </g>
</svg>
