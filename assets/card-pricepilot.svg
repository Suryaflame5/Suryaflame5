<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c16"/>
      <stop offset="100%" stop-color="#040d0a"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes floatChart {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .floating-chart { animation: floatChart 4.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="460" height="210" rx="14" fill="url(#pp-grad)"/>
  <rect width="458" height="208" x="1" y="1" rx="13" fill="none" stroke="url(#pp-border)" stroke-width="1.2"/>

  <!-- Top Metadata -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#34d399" letter-spacing="1">SYSTEM 03</text>
    <text x="96" y="14" class="mono" font-size="9" fill="#64748b">TIME-SERIES ML &amp; RISK</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(24, 66)">
    <text x="0" y="0" class="sans" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">PricePilot</text>
    <text x="115" y="-3" class="mono" font-size="11" font-weight="600" fill="#34d399">↗ [Source Code]</text>
    
    <text x="0" y="24" class="sans" font-size="12" fill="#94a3b8">
      Predictive Time-Series &amp; Decision-Support Engine
    </text>
    <text x="0" y="42" class="sans" font-size="11.5" fill="#64748b">
      Walk-forward backtesting, quantile risk &amp; model evaluation.
    </text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="10" y="15" class="mono" font-size="9.5" fill="#cbd5e1">Python</text>

    <rect x="64" y="0" width="84" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="74" y="15" class="mono" font-size="9.5" fill="#cbd5e1">Scikit-Learn</text>

    <rect x="156" y="0" width="54" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="166" y="15" class="mono" font-size="9.5" fill="#cbd5e1">FastAPI</text>

    <rect x="218" y="0" width="82" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="228" y="15" class="mono" font-size="9.5" fill="#cbd5e1">Backtesting</text>
  </g>

  <!-- 3D Candlestick / Graph Graphic on Right -->
  <g transform="translate(370, 105)" class="floating-chart">
    <polygon points="0,-40 38,-20 0,0 -38,-20" fill="#10b981" opacity="0.3"/>
    <!-- 3D Pillar 1 -->
    <g transform="translate(-20, -5) scale(0.65)">
      <polygon points="0,-16 12,-8 0,0 -12,-8" fill="#34d399"/>
      <polygon points="-12,-8 0,0 0,26 -12,18" fill="#059669"/>
      <polygon points="0,0 12,-8 12,18 0,26" fill="#10b981"/>
    </g>
    <!-- 3D Pillar 2 (Taller) -->
    <g transform="translate(0, -22) scale(0.75)">
      <polygon points="0,-16 12,-8 0,0 -12,-8" fill="#6ee7b7"/>
      <polygon points="-12,-8 0,0 0,38 -12,30" fill="#059669"/>
      <polygon points="0,0 12,-8 12,30 0,38" fill="#10b981"/>
    </g>
    <!-- 3D Pillar 3 -->
    <g transform="translate(20, -12) scale(0.7)">
      <polygon points="0,-16 12,-8 0,0 -12,-8" fill="#34d399"/>
      <polygon points="-12,-8 0,0 0,30 -12,22" fill="#059669"/>
      <polygon points="0,0 12,-8 12,22 0,30" fill="#10b981"/>
    </g>
  </g>
</svg>
