<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" width="100%" height="100%" style="background:#090b10; display:block; border-radius:10px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      @keyframes cadFlow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      .cad-stream {
        stroke-dasharray: 8 24;
        animation: cadFlow 3s linear infinite;
      }
    </style>
  </defs>

  <rect width="440" height="210" rx="10" fill="#090b10" stroke="#1e293b" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="20" y="18" width="90" height="20" rx="4" fill="#4f46e5" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8"/>
  <text x="65" y="32" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#a5b4fc">SUBSENTRY</text>
  <text x="120" y="32" font-size="13" font-weight="600" fill="#f1f5f9">Cadence Detection Engine</text>

  <text x="20" y="56" font-size="11" fill="#94a3b8">
    Local-first recurring cycle detector tracking transaction frequency drift with zero cloud exposure.
  </text>

  <!-- Flow Schematic -->
  <g transform="translate(20, 72)">
    <rect width="400" height="118" rx="6" fill="#0d1117" stroke="#1a202c" stroke-width="1"/>

    <!-- Signal Line -->
    <line x1="30" y1="44" x2="370" y2="44" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="30" y1="44" x2="370" y2="44" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7" class="cad-stream"/>

    <!-- Node 1: Ingest -->
    <g transform="translate(16, 18)">
      <rect width="105" height="52" rx="4" fill="#131823" stroke="#6366f1" stroke-width="0.7"/>
      <text x="52" y="22" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#c7d2fe">Transactions</text>
      <text x="52" y="35" text-anchor="middle" class="mono" font-size="8" fill="#64748b">Timestamp Normalizer</text>
      <text x="52" y="44" text-anchor="middle" class="mono" font-size="8" fill="#475569">Local SQLite Storage</text>
    </g>

    <!-- Node 2: Cadence Matching -->
    <g transform="translate(148, 18)">
      <rect width="105" height="52" rx="4" fill="#131823" stroke="#818cf8" stroke-width="0.7"/>
      <text x="52" y="22" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#e0e7ff">Interval Cluster</text>
      <text x="52" y="35" text-anchor="middle" class="mono" font-size="8" fill="#64748b">Billing Date Regress</text>
      <text x="52" y="44" text-anchor="middle" class="mono" font-size="8" fill="#475569">Irregular Cycle Filter</text>
    </g>

    <!-- Node 3: Local Dispatch -->
    <g transform="translate(280, 18)">
      <rect width="105" height="52" rx="4" fill="#131823" stroke="#10b981" stroke-width="0.7"/>
      <text x="52" y="22" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#6ee7b7">Renewal Trigger</text>
      <text x="52" y="35" text-anchor="middle" class="mono" font-size="8" fill="#64748b">On-Device Alert</text>
      <text x="52" y="44" text-anchor="middle" class="mono" font-size="8" fill="#475569">Zero-Telemetry Privacy</text>
    </g>

    <!-- Tech specs footer -->
    <text x="200" y="100" text-anchor="middle" class="mono" font-size="9" fill="#64748b">TYPESCRIPT · SQLITE · LOCAL-FIRST · STATISTICAL CLUSTERING</text>
  </g>
</svg>
