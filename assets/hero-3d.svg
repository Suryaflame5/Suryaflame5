<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="halo-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-violet" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ff0080" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Typography & 3D Blocks -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#4facfe"/>
      <stop offset="80%" stop-color="#b92b27"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 3D Cube Shading Gradients -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#004799"/>
    </linearGradient>

    <linearGradient id="cube-top-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cube-left-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="cube-right-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-2deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.85; stroke-width: 1.5; }
        50% { opacity: 0.25; stroke-width: 0.8; }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(320px); }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-core { animation: floatSlow 5s ease-in-out infinite; }
      .floating-node { animation: floatAlt 4s ease-in-out infinite; }
      .orbit-ring { transform-origin: 750px 150px; animation: orbitSpin 16s linear infinite; }
      .orbit-ring-rev { transform-origin: 750px 150px; animation: orbitSpin 22s linear infinite reverse; }
      .beacon-ring { animation: pulseBeam 2s ease-in-out infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
      .data-packet { stroke-dasharray: 8 16; animation: dataStream 3s linear infinite; }
    </style>
  </defs>

  <!-- Deep Sci-Fi / Cyber Background -->
  <rect width="960" height="320" rx="16" fill="#06080d"/>
  <rect width="960" height="320" rx="16" fill="url(#halo-cyan)"/>
  <rect width="960" height="320" rx="16" fill="url(#halo-violet)"/>

  <!-- 3D Perspective Isometric Grid Base -->
  <g opacity="0.18">
    <path d="M 0 320 L 480 180 L 960 320" stroke="#00f2fe" stroke-width="1.2" fill="none"/>
    <path d="M 120 320 L 480 180 L 840 320" stroke="#00f2fe" stroke-width="0.8" fill="none"/>
    <path d="M 240 320 L 480 180 L 720 320" stroke="#00f2fe" stroke-width="0.8" fill="none"/>
    <path d="M 360 320 L 480 180 L 600 320" stroke="#00f2fe" stroke-width="0.8" fill="none"/>
    <!-- Cross Lines -->
    <line x1="160" y1="285" x2="800" y2="285" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="280" y1="250" x2="680" y2="250" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="380" y1="215" x2="580" y2="215" stroke="#38bdf8" stroke-width="0.8"/>
  </g>

  <!-- Outer Glass Border -->
  <rect width="958" height="318" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="1.2"/>
  <rect width="956" height="316" x="2" y="2" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Top System Status HUD Bar -->
  <g transform="translate(36, 32)">
    <!-- Terminal Status Pill -->
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#0f172a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="14" cy="13" r="4.5" fill="#10b981" filter="url(#glow-subtle)"/>
    <circle cx="14" cy="13" r="2" fill="#ffffff"/>
    <text x="26" y="17" class="mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">SYSTEM ONLINE</text>

    <!-- Mode Badge -->
    <rect x="172" y="0" width="130" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8"/>
    <text x="182" y="17" class="mono" font-size="10" font-weight="600" fill="#c7d2fe">ROLE // AI &amp; SYSTEMS</text>

    <!-- Geographic Coordinates -->
    <text x="680" y="17" class="mono" font-size="10" fill="#64748b" text-anchor="end">LOC: 11.0168° N, 76.9558° E [IST]</text>
  </g>

  <!-- Left Main Column: Typography & Engineering Identity -->
  <g transform="translate(36, 84)">
    <!-- Main Headline with 3D Depth Shadow -->
    <text x="0" y="56" class="sans" font-size="44" font-weight="900" fill="#030712" letter-spacing="-1">
      P. SURYANARAYANAN
    </text>
    <text x="0" y="54" class="sans" font-size="44" font-weight="900" fill="url(#text-gradient)" letter-spacing="-1">
      P. SURYANARAYANAN
    </text>

    <!-- Technical Specialty Tagline -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="8" height="22" rx="2" fill="#00f2fe" filter="url(#glow-subtle)"/>
      <text x="18" y="16" class="mono" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
        AI INFERENCE ENGINES · DISTRIBUTED PROTOCOLS · NATIVE SYSTEMS
      </text>
    </g>

    <!-- Interactive-Look Terminal Typing Line -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="450" height="34" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="21" class="mono" font-size="12" fill="#38bdf8" font-weight="600">&gt;</text>
      <text x="30" y="21" class="mono" font-size="12" fill="#e2e8f0">
        Deploying deterministic ML &amp; low-latency runtimes
      </text>
      <rect x="424" y="9" width="8" height="15" fill="#00f2fe" class="cursor"/>
    </g>

    <!-- Key Performance Metrics Badges -->
    <g transform="translate(0, 180)">
      <!-- Badge 1 -->
      <g>
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#091e2b" stroke="#0284c7" stroke-width="0.8"/>
        <text x="10" y="18" class="mono" font-size="11" font-weight="700" fill="#38bdf8">⚡ &lt; 20ms Audio Sync</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="144" height="28" rx="6" fill="#1b1236" stroke="#9333ea" stroke-width="0.8"/>
        <text x="10" y="18" class="mono" font-size="11" font-weight="700" fill="#c084fc">🧠 Deterministic OCR</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="140" height="28" rx="6" fill="#06251b" stroke="#059669" stroke-width="0.8"/>
        <text x="10" y="18" class="mono" font-size="11" font-weight="700" fill="#34d399">🌐 Multi-Device P2P</text>
      </g>
    </g>
  </g>

  <!-- Right Column: 3D Animated Isometric Cyber Core & Orbits -->
  <g transform="translate(740, 160)">
    
    <!-- Outer Orbit Ring 1 (Cyan) -->
    <g class="orbit-ring">
      <ellipse cx="0" cy="0" rx="110" ry="42" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="6 14"/>
      <circle cx="110" cy="0" r="4" fill="#00f2fe" filter="url(#glow-cyan)"/>
      <circle cx="-110" cy="0" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Outer Orbit Ring 2 (Violet / Reverse) -->
    <g class="orbit-ring-rev">
      <ellipse cx="0" cy="0" rx="90" ry="34" fill="none" stroke="#d946ef" stroke-width="1.4" stroke-opacity="0.7"/>
      <circle cx="0" cy="34" r="5" fill="#f43f5e" filter="url(#glow-cyan)"/>
      <circle cx="0" cy="-34" r="3" fill="#d946ef"/>
    </g>

    <!-- Isometric Data Connection Beams -->
    <path d="M -80 -60 L 0 0 L 80 -60" stroke="#00f2fe" stroke-width="1" class="beacon-ring" stroke-opacity="0.4"/>
    <path d="M -80 60 L 0 0 L 80 60" stroke="#d946ef" stroke-width="1" class="beacon-ring" stroke-opacity="0.4"/>

    <!-- Central Floating 3D Isometric Cluster -->
    <g class="floating-core">
      <!-- Glow Under Core -->
      <ellipse cx="0" cy="40" rx="45" ry="18" fill="#00f2fe" opacity="0.25" filter="url(#glow-cyan)"/>

      <!-- Primary 3D Isometric Cube (Center) -->
      <g transform="translate(0, -10)">
        <!-- Top Face -->
        <polygon points="0,-36 34,-18 0,0 -34,-18" fill="url(#cube-top)"/>
        <!-- Left Face -->
        <polygon points="-34,-18 0,0 0,38 -34,20" fill="url(#cube-left)"/>
        <!-- Right Face -->
        <polygon points="0,0 34,-18 34,20 0,38" fill="url(#cube-right)"/>
        <!-- Highlight Edges -->
        <polyline points="-34,-18 0,0 34,-18" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
        <line x1="0" y1="0" x2="0" y2="38" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.8"/>
      </g>

      <!-- Sub-Cube 1 (Floating Top-Right Violet) -->
      <g transform="translate(56, -55) scale(0.55)" class="floating-node">
        <polygon points="0,-36 34,-18 0,0 -34,-18" fill="url(#cube-top-purple)"/>
        <polygon points="-34,-18 0,0 0,38 -34,20" fill="url(#cube-left-purple)"/>
        <polygon points="0,0 34,-18 34,20 0,38" fill="url(#cube-right-purple)"/>
      </g>

      <!-- Sub-Cube 2 (Floating Bottom-Left Cyan) -->
      <g transform="translate(-62, 28) scale(0.48)" class="floating-node">
        <polygon points="0,-36 34,-18 0,0 -34,-18" fill="url(#cube-top)"/>
        <polygon points="-34,-18 0,0 0,38 -34,20" fill="url(#cube-left)"/>
        <polygon points="0,0 34,-18 34,20 0,38" fill="url(#cube-right)"/>
      </g>
    </g>
  </g>
</svg>
