<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ss-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ss-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1306"/>
      <stop offset="100%" stop-color="#0c0702"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(-1.5deg); }
      }
      .floating-shield { animation: floatShield 4.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="460" height="210" rx="14" fill="url(#ss-grad)"/>
  <rect width="458" height="208" x="1" y="1" rx="13" fill="none" stroke="url(#ss-border)" stroke-width="1.2"/>

  <!-- Top Metadata -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#fbbf24" letter-spacing="1">SYSTEM 04</text>
    <text x="96" y="14" class="mono" font-size="9" fill="#64748b">GRAPH CADENCE ENGINE</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(24, 66)">
    <text x="0" y="0" class="sans" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">SubSentry</text>
    <text x="120" y="-3" class="mono" font-size="11" font-weight="600" fill="#fbbf24">↗ [Source Code]</text>
    
    <text x="0" y="24" class="sans" font-size="12" fill="#94a3b8">
      Recurring Financial Pattern Recognition Engine
    </text>
    <text x="0" y="42" class="sans" font-size="11.5" fill="#64748b">
      Client-side graph analysis, fuzzy reconciliation &amp; zero data leak.
    </text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="12" y="15" class="mono" font-size="9.5" fill="#cbd5e1">React</text>

    <rect x="64" y="0" width="76" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="74" y="15" class="mono" font-size="9.5" fill="#cbd5e1">TypeScript</text>

    <rect x="148" y="0" width="84" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="158" y="15" class="mono" font-size="9.5" fill="#cbd5e1">WebWorkers</text>

    <rect x="240" y="0" width="84" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="250" y="15" class="mono" font-size="9.5" fill="#cbd5e1">GraphEngine</text>
  </g>

  <!-- 3D Node Cluster Graphic on Right -->
  <g transform="translate(370, 105)" class="floating-shield">
    <ellipse cx="0" cy="20" rx="36" ry="12" fill="#f59e0b" opacity="0.25"/>
    <!-- Connecting Edges -->
    <line x1="-24" y1="-14" x2="0" y2="6" stroke="#f59e0b" stroke-width="1.4" opacity="0.8"/>
    <line x1="24" y1="-14" x2="0" y2="6" stroke="#fbbf24" stroke-width="1.4" opacity="0.8"/>
    <line x1="0" y1="-32" x2="0" y2="6" stroke="#f59e0b" stroke-width="1.4" opacity="0.8"/>

    <!-- Central 3D Node Cube -->
    <g transform="translate(0, 6) scale(0.7)">
      <polygon points="0,-20 18,-10 0,0 -18,-10" fill="#fbbf24"/>
      <polygon points="-18,-10 0,0 0,22 -18,12" fill="#b45309"/>
      <polygon points="0,0 18,-10 18,12 0,22" fill="#d97706"/>
    </g>

    <!-- Satellite Nodes -->
    <circle cx="-24" cy="-14" r="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="24" cy="-14" r="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="-32" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  </g>
</svg>
