<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e2b"/>
      <stop offset="100%" stop-color="#090614"/>
    </linearGradient>
    <filter id="wp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes pulseRing {
        0% { r: 12px; opacity: 0.9; }
        100% { r: 38px; opacity: 0; }
      }
      @keyframes floatAudio {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      .acoustic-ring1 { animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .acoustic-ring2 { animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 0.7s; }
      .floating-speaker { animation: floatAudio 4.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="460" height="210" rx="14" fill="url(#wp-grad)"/>
  <rect width="458" height="208" x="1" y="1" rx="13" fill="none" stroke="url(#wp-border)" stroke-width="1.2"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#6b21a8" fill-opacity="0.3" stroke="#a855f7" stroke-width="0.8"/>
    <text x="8" y="14" class="mono" font-size="9" font-weight="700" fill="#c084fc" letter-spacing="1">SYSTEM 02</text>
    <text x="96" y="14" class="mono" font-size="9" fill="#64748b">AUDIO HAL &amp; NATIVE NDK</text>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(24, 66)">
    <text x="0" y="0" class="sans" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">WePlay</text>
    <text x="94" y="-3" class="mono" font-size="11" font-weight="600" fill="#c084fc">↗ [Source Code]</text>
    
    <text x="0" y="24" class="sans" font-size="12" fill="#94a3b8">
      Universal Android Audio Distribution Platform
    </text>
    <text x="0" y="42" class="sans" font-size="11.5" fill="#64748b">
      Auracast broadcast &amp; synchronized Wi-Fi P2P audio sync.
    </text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="82" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="10" y="15" class="mono" font-size="9.5" fill="#cbd5e1">Android/NDK</text>

    <rect x="90" y="0" width="54" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="100" y="15" class="mono" font-size="9.5" fill="#cbd5e1">Kotlin</text>

    <rect x="152" y="0" width="76" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="162" y="15" class="mono" font-size="9.5" fill="#cbd5e1">WebSockets</text>

    <rect x="236" y="0" width="60" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="246" y="15" class="mono" font-size="9.5" fill="#cbd5e1">Auracast</text>
  </g>

  <!-- 3D Acoustic Wave Node on Right -->
  <g transform="translate(370, 105)" class="floating-speaker">
    <!-- Animated Acoustic Rings -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#d946ef" stroke-width="1.6" class="acoustic-ring1"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#a855f7" stroke-width="1.6" class="acoustic-ring2"/>

    <!-- Central Isometric Node Cube -->
    <g transform="translate(0, -6) scale(0.85)">
      <polygon points="0,-24 22,-12 0,0 -22,-12" fill="#d946ef"/>
      <polygon points="-22,-12 0,0 0,26 -22,14" fill="#7e22ce"/>
      <polygon points="0,0 22,-12 22,14 0,26" fill="#a855f7"/>
      <!-- Inner glowing core -->
      <circle cx="0" cy="0" r="5" fill="#fdf4ff" filter="url(#wp-glow)"/>
    </g>
  </g>
</svg>
