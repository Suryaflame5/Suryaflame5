<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      .beacon { transform-origin: 730px 48px; animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="230" rx="12" fill="url(#bg-grad)"/>
  <rect width="920" height="230" rx="12" fill="url(#grid-pattern)"/>
  <rect width="918" height="228" x="1" y="1" rx="11" fill="none" stroke="#21262d" stroke-width="1.2"/>

  <!-- Top Decorative Bar -->
  <path d="M 1 20 L 919 20" stroke="url(#line-glow)" stroke-width="1"/>
  
  <!-- System Metadata Header -->
  <text x="32" y="14" class="mono" font-size="9.5" fill="#6e7681" letter-spacing="1.5">NODE // SURYANARAYANAN.SYS</text>
  <text x="460" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#58a6ff" letter-spacing="2">ARCHITECTURAL AI &amp; DISTRIBUTED RUNTIMES</text>
  <text x="888" y="14" text-anchor="end" class="mono" font-size="9.5" fill="#6e7681" letter-spacing="1.5">VER. 2026.4</text>

  <!-- Left Content: Identity & Positioning -->
  <g transform="translate(34, 46)">
    <!-- Terminal Tag -->
    <rect x="0" y="0" width="138" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="8" y="13.5" class="mono" font-size="10" fill="#00f2fe" font-weight="600" letter-spacing="0.5">ENGINEERING PROFILE</text>

    <!-- Main Title -->
    <text x="0" y="54" class="sans" font-size="32" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
      P. Suryanarayanan
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="80" class="mono" font-size="13" font-weight="600" fill="#7ee787" letter-spacing="0.5">
      AI/ML &amp; Systems Software Engineer
    </text>

    <!-- Core Philosophy / Focus Statement -->
    <text x="0" y="106" class="sans" font-size="12.5" fill="#8b949e">
      Building deterministic ML inference pipelines, low-latency cross-device protocols,
    </text>
    <text x="0" y="125" class="sans" font-size="12.5" fill="#8b949e">
      and audit-traceable backend architectures designed for production resilience.
    </text>
  </g>

  <!-- Right Content: Live System Status Card -->
  <g transform="translate(620, 46)">
    <rect x="0" y="0" width="268" height="138" rx="8" fill="#111622" stroke="#30363d" stroke-width="1"/>
    
    <!-- Header of Status Box -->
    <rect x="0" y="0" width="268" height="28" rx="8" fill="#161b26"/>
    <line x1="0" y1="28" x2="268" y2="28" stroke="#30363d" stroke-width="0.8"/>
    
    <!-- Active Pulse Beacon -->
    <circle cx="18" cy="14" r="5" fill="#3fb950" class="beacon"/>
    <circle cx="18" cy="14" r="2.5" fill="#2ea043"/>
    
    <text x="32" y="17.5" class="mono" font-size="10" font-weight="700" fill="#3fb950" letter-spacing="1">
      STATUS: OPEN TO ROLES
    </text>

    <!-- Status Details -->
    <text x="18" y="52" class="mono" font-size="9.5" fill="#8b949e">TARGET ROLES</text>
    <text x="18" y="68" class="sans" font-size="12" font-weight="600" fill="#e6edf3">AI/ML Engineer · Systems Engineer</text>

    <text x="18" y="94" class="mono" font-size="9.5" fill="#8b949e">CORE SPECIALTIES</text>
    <text x="18" y="110" class="sans" font-size="12" font-weight="500" fill="#c9d1d9">Deep Learning, Audio HAL, Async APIs</text>
    
    <line x1="18" y1="122" x2="250" y2="122" stroke="#21262d" stroke-width="1"/>
    <text x="18" y="132" class="mono" font-size="9" fill="#58a6ff">LOCATION: India [IST / Remote Friendly]</text>
  </g>

  <!-- Bottom Accent Trace Line -->
  <path d="M 32 208 L 220 208 L 240 216 L 900 216" stroke="#21262d" stroke-width="1.2" fill="none"/>
  <circle cx="240" cy="216" r="2.5" fill="#00f2fe"/>
</svg>
