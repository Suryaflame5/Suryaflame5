<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="meter-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="meter-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="meter-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="meter-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes waveAnim1 {
        0%, 100% { height: 18px; y: 12px; }
        50% { height: 32px; y: 5px; }
      }
      @keyframes waveAnim2 {
        0%, 100% { height: 28px; y: 7px; }
        50% { height: 12px; y: 15px; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .wave-bar1 { animation: waveAnim1 1.2s ease-in-out infinite; }
      .wave-bar2 { animation: waveAnim2 1.4s ease-in-out infinite; }
      .live-dot { animation: pulseGlow 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="140" rx="12" fill="#090d16" stroke="#1f2937" stroke-width="1.2"/>

  <!-- Metric 1: DocuMind Extraction -->
  <g transform="translate(24, 20)">
    <rect width="210" height="100" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">DOCUMIND ENGINE</text>
    <text x="14" y="54" class="sans" font-size="24" font-weight="800" fill="#f8fafc">99.4%</text>
    <text x="88" y="52" class="mono" font-size="11" fill="#64748b">F1 Score</text>
    <!-- Progress bar -->
    <rect x="14" y="68" width="180" height="6" rx="3" fill="#1e293b"/>
    <rect x="14" y="68" width="168" height="6" rx="3" fill="url(#meter-cyan)"/>
    <text x="14" y="88" class="mono" font-size="9.5" fill="#94a3b8">Zero-hallucination bounds</text>
  </g>

  <!-- Metric 2: WePlay Latency -->
  <g transform="translate(254, 20)">
    <rect width="210" height="100" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1">WEPLAY AUDIO SYNC</text>
    <text x="14" y="54" class="sans" font-size="24" font-weight="800" fill="#f8fafc">&lt; 18.2</text>
    <text x="96" y="52" class="mono" font-size="11" fill="#64748b">ms Latency</text>
    <!-- Waveform Visualizer -->
    <g transform="translate(14, 62)">
      <rect x="0" y="10" width="4" height="20" rx="2" fill="#d946ef" class="wave-bar1"/>
      <rect x="8" y="5" width="4" height="28" rx="2" fill="#c084fc" class="wave-bar2"/>
      <rect x="16" y="14" width="4" height="16" rx="2" fill="#818cf8" class="wave-bar1"/>
      <rect x="24" y="4" width="4" height="30" rx="2" fill="#38bdf8" class="wave-bar2"/>
      <rect x="32" y="12" width="4" height="18" rx="2" fill="#00f2fe" class="wave-bar1"/>
      <rect x="40" y="6" width="4" height="26" rx="2" fill="#d946ef" class="wave-bar2"/>
      <rect x="48" y="15" width="4" height="15" rx="2" fill="#c084fc" class="wave-bar1"/>
      <rect x="56" y="8" width="4" height="22" rx="2" fill="#818cf8" class="wave-bar2"/>
      <rect x="64" y="12" width="4" height="18" rx="2" fill="#38bdf8" class="wave-bar1"/>
      <text x="80" y="22" class="mono" font-size="9.5" fill="#94a3b8">Clock-drift jitter buffer</text>
    </g>
  </g>

  <!-- Metric 3: PricePilot Uncertainty -->
  <g transform="translate(484, 20)">
    <rect width="210" height="100" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">PRICEPILOT ENGINE</text>
    <text x="14" y="54" class="sans" font-size="24" font-weight="800" fill="#f8fafc">95.0%</text>
    <text x="92" y="52" class="mono" font-size="11" fill="#64748b">Coverage</text>
    <rect x="14" y="68" width="180" height="6" rx="3" fill="#1e293b"/>
    <rect x="14" y="68" width="162" height="6" rx="3" fill="url(#meter-emerald)"/>
    <text x="14" y="88" class="mono" font-size="9.5" fill="#94a3b8">Quantile risk calibration</text>
  </g>

  <!-- Metric 4: SubSentry In-Browser -->
  <g transform="translate(714, 20)">
    <rect width="222" height="100" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="1">SUBSENTRY GRAPH</text>
    <text x="14" y="54" class="sans" font-size="24" font-weight="800" fill="#f8fafc">0-Server</text>
    <text x="120" y="52" class="mono" font-size="11" fill="#64748b">Privacy</text>
    <rect x="14" y="68" width="190" height="6" rx="3" fill="#1e293b"/>
    <rect x="14" y="68" width="190" height="6" rx="3" fill="url(#meter-amber)"/>
    <text x="14" y="88" class="mono" font-size="9.5" fill="#94a3b8">Client-side Web Workers</text>
  </g>
</svg>
